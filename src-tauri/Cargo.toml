[package]
name = "exploreasl_gui"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[workspace]
members = ["crates/execution-runtime"]
default-members = [".", "crates/execution-runtime"]
resolver = "2"

[workspace.dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
libc = "0.2"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
tempfile = "3"
windows-sys = "0.61.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exploreasl_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-log = "2.10.1"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json", "uuid"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
serde_path_to_error = "=0.1.20"
walkdir = "2"
regex = "1.13.1"
tauri-plugin-clipboard-manager = "2.5.0"
notify = "8.2.1"
num_cpus = "1"
sha2 = "0.11.1"
hex = "0.4.3"
tempfile = { workspace = true }
csv = "1.4.0"
calamine = "0.37.0"
libc = { workspace = true }
strsim = "0.11.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.5.5"
unicode-normalization = "0.1.26"
unicode-casefold = "0.2.0"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
easl-execution-runtime = { path = "crates/execution-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
specta-serde = "=0.0.13"
tauri = { version = "2.12.5", features = ["test"] }
