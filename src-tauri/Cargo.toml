[package]
name = "exploreasl_gui"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[workspace]
members = ["crates/execution-runtime"]
default-members = [".", "crates/execution-runtime"]
resolver = "2"

[workspace.dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
libc = "0.2"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
tempfile = "3"
windows-sys = "0.61.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exploreasl_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
thiserror = "2"
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2.9.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
serde_path_to_error = "=0.1.20"
walkdir = "2"
regex = "1.12.3"
tauri-plugin-clipboard-manager = "2.3.2"
notify = "8.2.0"
num_cpus = "1"
sha2 = "0.10"
tempfile = { workspace = true }
csv = "1.4.0"
calamine = "0.35.0"
libc = { workspace = true }
strsim = "0.11.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.4"
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
easl-execution-runtime = { path = "crates/execution-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
