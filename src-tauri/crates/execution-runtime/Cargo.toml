[package]
name = "easl-execution-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
libc = { workspace = true }
process-wrap = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
tempfile = { workspace = true }
