name: "🚀 Feature Request"
description: Suggest an idea or new feature for ExploreASL GUI.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make ExploreASL GUI better? We'd love to hear it! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: |
        A clear and concise description of what the problem or limitation is.
        e.g., "I am frustrated when I try to do X and have to manually do Y instead."
      placeholder: Describe the problem...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how you envision it working in the GUI.
      placeholder: Describe the requested feature...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions, designs, or workarounds you've considered.
      placeholder: Describe alternatives...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or reference links here.
      placeholder: Link or drag-drop files/mockups here...
    validations:
      required: false
