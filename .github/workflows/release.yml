name: "Release"

# Manual signed release.
#
# HOW TO CUT A RELEASE:
#   1. Bump matching semver versions in package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml on main.
#   2. Actions tab -> "Release" -> "Run workflow".
#   3. The workflow checks updater signing inputs, creates or reuses a DRAFT release, then uploads signed platform artifacts and latest.json.
#   4. Review the draft, edit notes if needed, then click "Publish release". The public latest.json endpoint only tracks published releases.
#
# UPDATER SIGNING (required):
#   TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are GitHub secrets.
#   TAURI_UPDATER_PUBKEY is a GitHub repository variable. Never print any value.

on:
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version and updater signing configuration
        id: release-inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "Missing required updater signing configuration."
            exit 1
          fi

          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(python3 -c "import re; print(re.search(r'^version\\s*=\\s*\\\"([^\\\"]+)\\\"', open('src-tauri/Cargo.toml').read(), re.M).group(1))")
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$VERSION" =~ $SEMVER ]] || [ "$VERSION" != "$PACKAGE_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch or invalid semver across package.json, tauri.conf.json, and Cargo.toml."
            exit 1
          fi

          echo "Release version $VERSION validated."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.release-inputs.outputs.version }}";
            const tag = `v${version}`;
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: true,
                prerelease: false,
                generate_release_notes: true,
              });
              return data.id;
            } catch (error) {
              if (error.status !== 422) throw error;
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = releases.find((release) => release.tag_name === tag);
              if (!existing) throw error;
              if (!existing.draft) throw new Error(`Release ${tag} already exists and is published.`);
              core.info(`Reusing failed-run draft release ${tag}.`);
              return existing.id;
            }

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable signed updater artifacts
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          tmp=$(mktemp)
          jq \
            --arg pubkey "$TAURI_UPDATER_PUBKEY" \
            '.bundle.createUpdaterArtifacts = true
             | .plugins.updater.pubkey = $pubkey' \
            src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          echo "Signed updater artifacts enabled."

      - name: Build with Tauri and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: v${{ needs.create-release.outputs.version }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
