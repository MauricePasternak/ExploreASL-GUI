name: "CI"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── OpenSpec ────────────────────────────────────────────────────────────

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical specifications
        run: pnpm spec:validate

      - name: Check OpenSpec relationships
        run: pnpm spec:doctor

  # ── Frontend pipeline ──────────────────────────────────────────────────

  format-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check:frontend

  lint-ts:
    needs: format-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint
        run: pnpm lint:frontend

      - name: Type-check
        run: pnpm typecheck

  test-ts:
    needs: format-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:frontend

  # ── Backend pipeline ───────────────────────────────────────────────────

  format-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rustfmt
        run: pnpm format:check:backend

  lint-rust:
    needs: format-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Clippy
        run: pnpm lint:backend

  test-rust:
    needs: format-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p exploreasl_gui

  # Standalone process/filesystem runtime needs no Tauri GUI dependencies.
  # Retained platform-specific process and capability tests compile on each desktop OS.
  execution-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Test process scopes and capability filesystem operations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p easl-execution-runtime --all-targets

  bids-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.6
      - name: Cache conformance dependencies (network allowed)
        run: deno install --config tools/bids-conformance/deno.json --frozen --entrypoint tools/bids-conformance/check.ts
      - name: Test native BIDS inheritance
        run: "cargo test --locked --manifest-path src-tauri/Cargo.toml -p exploreasl_gui bids::"
      - name: Validate fixture (network denied)
        run: deno task --config tools/bids-conformance/deno.json check

  # ── E2E ────────────────────────────────────────────────────────────────

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e-tests/pnpm-lock.yaml

      - name: Install Tauri and WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm --dir e2e-tests install --frozen-lockfile

      - name: Run E2E helper tests
        run: pnpm test:e2e:unit

      - name: Type-check E2E tests
        run: pnpm typecheck:e2e

      - name: Build E2E application
        run: VITE_E2E=1 pnpm tauri build --debug --no-bundle

      - name: Run native E2E tests
        run: xvfb-run -a env E2E_SKIP_BUILD=1 pnpm test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: e2e-tests/artifacts/
          if-no-files-found: ignore
