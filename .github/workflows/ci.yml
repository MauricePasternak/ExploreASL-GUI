name: "CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_analysis:
        description: "Run slow real ds003151 analysis (Linux/Apptainer)"
        type: boolean
        default: false
      sif_url:
        description: "HTTPS URL for compatible compiled ExploreASL SIF (no default asset)"
        type: string
      sif_sha256:
        description: "Expected SHA256 of supplied SIF"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── OpenSpec ────────────────────────────────────────────────────────────

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical specifications
        run: pnpm spec:validate

      - name: Check OpenSpec relationships
        run: pnpm spec:doctor

  # ── Frontend pipeline ──────────────────────────────────────────────────

  format-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check:frontend

  lint-ts:
    needs: format-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Type checking verifies bindings against the native command registry.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint
        run: pnpm lint:frontend

      - name: Type-check
        run: pnpm typecheck

  test-ts:
    needs: format-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:frontend

  # ── Backend pipeline ───────────────────────────────────────────────────

  format-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rustfmt
        run: pnpm format:check:backend

  lint-rust:
    needs: format-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Clippy
        run: pnpm lint:backend

  test-rust:
    needs: format-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p exploreasl_gui

  # Standalone process/filesystem runtime needs no Tauri GUI dependencies.
  # Retained platform-specific process and capability tests compile on each desktop OS.
  execution-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Test process scopes and capability filesystem operations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p easl-execution-runtime --all-targets

  bids-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.6
      - name: Cache conformance dependencies (network allowed)
        run: deno install --config tools/bids-conformance/deno.json --frozen --entrypoint tools/bids-conformance/check.ts
      - name: Test native BIDS inheritance
        run: "cargo test --locked --manifest-path src-tauri/Cargo.toml -p exploreasl_gui bids::"
      - name: Test Windows import preflight regression
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p exploreasl_gui import::tests::pipeline::windows_absolute_run_alias_rejection_preserves_staging_and_run -- --exact
      - name: Test Windows processing acknowledgement regression
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p exploreasl_gui processing::tests::native::windows_acknowledgement_preserves_terminal_until_committed_archive_cleanup_succeeds -- --exact
      - name: Validate fixture (network denied)
        run: deno task --config tools/bids-conformance/deno.json check

  # ── E2E ────────────────────────────────────────────────────────────────

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e-tests/pnpm-lock.yaml

      - name: Install Tauri and WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm --dir e2e-tests install --frozen-lockfile

      - name: Run E2E helper tests
        run: pnpm test:e2e:unit

      - name: Type-check E2E tests
        run: pnpm typecheck:e2e

      - name: Build E2E application
        run: VITE_E2E=1 pnpm tauri build --debug --no-bundle

      - name: Run native E2E tests
        run: xvfb-run -a env E2E_SKIP_BUILD=1 pnpm test:e2e

      - name: Install Apptainer for opted-in analysis
        if: github.event_name == 'workflow_dispatch' && inputs.full_analysis
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Fetch explicitly supplied compiled SIF
        if: github.event_name == 'workflow_dispatch' && inputs.full_analysis
        env:
          SIF_URL: ${{ inputs.sif_url }}
          SIF_SHA256: ${{ inputs.sif_sha256 }}
        run: |
          [[ "$SIF_URL" == https://* ]] || { echo 'Full analysis requires an explicit HTTPS SIF URL'; exit 1; }
          [[ "$SIF_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Full analysis requires a SHA256 checksum'; exit 1; }
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$SIF_URL" --output "$RUNNER_TEMP/full-analysis.sif"
          printf '%s  %s\n' "$SIF_SHA256" "$RUNNER_TEMP/full-analysis.sif" | sha256sum --check -
          echo "E2E_SIF_PATH=$RUNNER_TEMP/full-analysis.sif" >> "$GITHUB_ENV"
          echo "E2E_SIF_SHA256=$SIF_SHA256" >> "$GITHUB_ENV"

      - name: Run opted-in real analysis through native GUI
        if: github.event_name == 'workflow_dispatch' && inputs.full_analysis
        run: xvfb-run -a dbus-run-session -- env E2E_SKIP_BUILD=1 pnpm test:e2e:full-analysis

      - name: Upload E2E artifacts
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.full_analysis)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-tests/artifacts/
            !e2e-tests/artifacts/**/home/**
            !e2e-tests/artifacts/**/cache/**
            !e2e-tests/artifacts/**/tmp/**
            !e2e-tests/artifacts/**/apptainer-cache/**
          include-hidden-files: true
          if-no-files-found: ignore
